name: Feature request
description: Something mfeflow should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Team size, monorepo or polyrepo, bundler, anything relevant.
